name: LaTeX examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build example PDFs
        run: >-
          docker run --rm --volume "${GITHUB_WORKSPACE}:/workdir" --workdir /workdir texlive/texlive:TL2025-historic bin/compile-examples.sh
      - name: Store example PDFs
        uses: actions/upload-artifact@v4
        with:
          name: examples
          path: build/*.pdf
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve example PDFs
        uses: actions/download-artifact@v5
        with:
          name: examples
          path: release
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*.pdf --generate-notes --title "Template ${GITHUB_REF_NAME}" --verify-tag
